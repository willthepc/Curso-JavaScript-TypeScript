<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <section class="container">
      <h1>Tabela de IMC</h1>
      <section class="left">
        <h3>IMC</h3>
        <p>Menos do que 18,5</p>
        <p>Entre 18,5 e 24,9</p>
        <p>Entre 25 e 29,9</p>
        <p>Entre 30 e 34,9</p>
        <p>Entre 35 e 39,9</p>
        <p>Mais do que 40</p>
      </section>
      <section class="right">
        <h3>Resultado</h3>
          <p>Abaixo do peso</p>
          <p>Peso normal</p>
          <p>Sobrepeso</p>
          <p>Obesidade grau 1</p>
          <p>Obesidade grau 2</p>
          <p>Obesidade grau 3</p>
      </section>
      
      <h2 style="clear: both;">Calcule seu IMC</h2>

      <form action="" class="form">
        <label for="peso">Peso:</label>
        <input class="peso" id="peso" type="text"/>

        <label for="altura">Altura:</label>
        <input class="altura" id="altura" type="text"/>

        <button type="submit">Calcular</button>
      </form>
    </section>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
