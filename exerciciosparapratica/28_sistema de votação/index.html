<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Simples</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <form action="" class="container">
    
      <h1>Calculadora</h1>
      <div class="inputs">
        <input type="text" id="num1" placeholder="Digite o primeiro número" />
        <input type="text" id="num2" placeholder="Digite o segundo número" />
      </div>
      <select id="operador">
        <option class="soma" value="+">Somar (+)</option>
        <option class="subtrair" value="-">Subtrair (−)</option>
        <option class="multiplicar" value="*">Multiplicar (×)</option>
        <option class="dividir" value="/">Dividir (÷)</option>
      </select>
      <button type="submit" id="calcular">Calcular</button>
      <div class="resultado">
        Resultado: <span id="resultado">---</span>
      </div>
  </form>

  <script src="assets/js/script.js"></script>
</body>
</html>
